<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
            .footer-bottom {
                background-color: #1e3a8a;
                color: white;
                padding: 1rem;
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                display: flex;
                flex-direction: column;
                align-items: center;
                text-align: center;
                font-size: 0.95rem;
                direction: ltr; /* ✅ force left-to-right order */
            }

            .contact-line {
                display: flex;
                justify-content: center;
                align-items: center;
                flex-wrap: wrap;
                gap: 250px;
            }

            .website-link {
                color: #ff9900;
                font-weight: 700;
                text-decoration: none;
            }

            .website-link:hover {
                color: white;
                text-decoration: underline;
            }

            .contact-item {
                display: flex;
                align-items: center;
                gap: 6px;
                color: white;
            }

            .contact-icon {
                width: 24px;
                height: 24px;
                background-color: #ff9900;
                border-radius: 50%;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 0.8rem;
                color: white;
            }

            .copyright-line {
                color: rgba(255, 255, 255, 0.8);
                font-size: 0.85rem;
                margin-top: 0.4rem;
            }
        </style>
</head>
<body>

    <footer class="footer">
        <div class="footer-bottom">
            <div class="contact-line">
                <a href="#" class="website-link">Salis</a>
                <div class="contact-item">
                    <div class="contact-icon">📞</div>
                    <span>+20 122 399 9209</span>
                </div>
                <div class="contact-item">
                    <div class="contact-icon">✉️</div>
                    <span>mfarouk@shiftits.com</span>
                </div>
                 <div class="copyright-line">
                &copy; 2025 All rights reserved.
            </div>
            </div>

           
        </div>
    </footer>
</body>
</html>
